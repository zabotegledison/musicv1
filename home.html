  <script>
    // Home hero: the real notation of Telecoteco 1, drawn from the project's
    // own pattern library and coloured by family, with a playhead sweeping the
    // two bars. Display only — no audio, no interaction, nothing shared with
    // the app's generator.
    (function () {
      document.addEventListener('DOMContentLoaded', async function () {
        const stage = document.getElementById('heroScore');
        if (!stage || typeof opensheetmusicdisplay === 'undefined') return;
        try {
          const resp = await fetch('assets/hero/telecoteco.musicxml');
          const xml = await resp.text();
          const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay('heroScoreInner', {
            backend: 'svg', drawTitle: false, drawSubtitle: false, drawComposer: false,
            drawPartNames: false, drawMeasureNumbers: false, autoResize: true
          });
          await osmd.load(xml);
          osmd.EngravingRules.PageBackgroundColor = '#FBFBF8';
          osmd.EngravingRules.DefaultColorMusic = '#000000';
          osmd.EngravingRules.ColoringEnabled = true;
          osmd.EngravingRules.RenderSingleHorizontalStaffline = true;
          osmd.render();
          stage.classList.add('ready');
        } catch (e) {
          // if anything fails the hero simply stays without the score
          stage.style.display = 'none';
          console.warn('Hero score not shown:', e);
        }
      });
    })();
  </script>
